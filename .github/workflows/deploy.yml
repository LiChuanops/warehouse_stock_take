name: Build and deploy to GitHub Pages

# GitHub Pages 只会照原样发布静态档案,不会自己跑 npm build。
# 这支流程负责在推上 main 之后帮你 build,再把 dist/ 发布出去。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署,后推的会取消前一个
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 建置
        run: npm run build

      # enablement:true 让这支 workflow 自己把 Pages 开起来,
      # 不用先去 Settings 手动设 Source。靠的是上面宣告的 pages: write 权限。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
